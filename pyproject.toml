[project]
name = "llm-memorization"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "numpy>=2.2",
    "tiktoken>=0.8",
    "torch>=2.15",
    "transformers>=5.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
